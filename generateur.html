<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur de build</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { border-collapse: collapse; margin: 10px 0; }
    td, th { padding: 4px 12px; text-align: left; }
    input[type=number] { width: 70px; }
    .resultat { border: 1px solid #aaa; border-radius: 8px; padding: 10px; margin: 12px 0; }
    .piece { display: flex; align-items: center; margin: 3px 0; }
    .piece img { width: 40px; height: 40px; margin-right: 10px; }
    .stats { color: #555; }
    #message { color: #b00020; }
  </style>
</head>
<body>
  <h1>Générateur de build</h1>
  <p id="statut">Chargement...</p>

  <div id="formulaire" style="display:none">
    <p>Classe :
      <select id="choixClasse">
        <option value="0">Titan</option>
        <option value="1">Chasseur</option>
        <option value="2">Arcaniste</option>
      </select>
    </p>
    <p>Pièce exotique :
      <select id="choixExotique"></select>
    </p>

    <table id="tableStats"></table>

    <p><button id="chercher">Chercher les meilleurs sets</button></p>
    <p id="message"></p>
  </div>

  <div id="resultats"></div>
  <p><a href="armures.html">Mes armures</a> | <a href="equiper.html">Équiper un set</a> | <a href="profil.html">Profil</a></p>

  <script>
    const CLE_API = "8f0fe7144bbc4fdda21ed3a26889aecb";
    const LANGUE = "fr";
    const jeton = sessionStorage.getItem("jeton");

    const MAX_STAT = 200;   // au-delà, les points ne comptent plus
    const TOP = 5;          // nombre de sets proposés
    const LIMITE_ESSAIS = 5000000; // sécurité contre une recherche trop longue

    const statut = document.getElementById("statut");
    const message = document.getElementById("message");
    const formulaire = document.getElementById("formulaire");
    const choixClasse = document.getElementById("choixClasse");
    const choixExotique = document.getElementById("choixExotique");
    const tableStats = document.getElementById("tableStats");
    const zoneResultats = document.getElementById("resultats");

    const EMPLACEMENTS_ARMURE = {
      3448274439: "Casque",
      3551918588: "Gants",
      14239492: "Torse",
      20886954: "Jambes",
      1585787867: "Objet de classe"
    };
    const ORDRE = ["Casque", "Gants", "Torse", "Jambes", "Objet de classe"];
    const STATS_ARMURE = [2996146975, 392767087, 1943323491, 1735777505, 144602215, 4244567218];

    let definitionsStats = {};
    let toutesLesArmures = [];

    // ---------- Parler à Bungie et charger les données ----------

    async function appelerBungie(chemin) {
      const reponse = await fetch("https://www.bungie.net/Platform" + chemin, {
        headers: { "X-API-Key": CLE_API, "Authorization": "Bearer " + jeton }
      });
      const donnees = await reponse.json();
      if (donnees.ErrorStatus !== "Success") {
        throw new Error(donnees.ErrorStatus + " - " + donnees.Message);
      }
      return donnees.Response;
    }

    async function chargerDefinitions() {
      const manifest = await appelerBungie("/Destiny2/Manifest/");
      const chemins = manifest.jsonWorldComponentContentPaths[LANGUE];

      const cheminObjets =
        chemins.DestinyInventoryItemLiteDefinition ||
        chemins.DestinyInventoryItemDefinition;
      const reponseObjets = await fetch("https://www.bungie.net" + cheminObjets);
      const objets = await reponseObjets.json();

      const reponseStats = await fetch("https://www.bungie.net" + chemins.DestinyStatDefinition);
      const stats = await reponseStats.json();

      return { objets: objets, stats: stats };
    }

    function nomStat(hash) {
      const definition = definitionsStats[hash];
      return definition ? definition.displayProperties.name : "Stat " + hash;
    }

    function texteStats(stats) {
      stats = stats || {};
      const morceaux = [];
      for (const hash of STATS_ARMURE) {
        if (stats[hash]) {
          morceaux.push(nomStat(hash) + " " + stats[hash]);
        }
      }
      return morceaux.join(" · ");
    }

    function lireStats(statsObjets, idInstance) {
      const resultat = {};
      const donnees = statsObjets[idInstance];
      if (!donnees || !donnees.stats) {
        return resultat;
      }
      for (const hash of STATS_ARMURE) {
        if (donnees.stats[hash]) {
          resultat[hash] = donnees.stats[hash].value;
        }
      }
      return resultat;
    }

    function totalDesStats(stats) {
      let somme = 0;
      for (const hash of STATS_ARMURE) {
        somme += (stats && stats[hash]) || 0;
      }
      return somme;
    }

    // ---------- Le formulaire ----------

    function construireTableau() {
      tableStats.innerHTML = "";

      const entete = document.createElement("tr");
      entete.innerHTML = "<th>Stat</th><th>Importance (0 à 10)</th><th>Minimum voulu</th>";
      tableStats.appendChild(entete);

      STATS_ARMURE.forEach(function (hash, k) {
        const ligne = document.createElement("tr");

        const celluleNom = document.createElement("td");
        celluleNom.textContent = nomStat(hash);

        const cellulePoids = document.createElement("td");
        cellulePoids.innerHTML = '<input type="number" id="poids' + k + '" min="0" max="10" value="0">';

        const celluleMin = document.createElement("td");
        celluleMin.innerHTML = '<input type="number" id="min' + k + '" min="0" max="200" value="0">';

        ligne.appendChild(celluleNom);
        ligne.appendChild(cellulePoids);
        ligne.appendChild(celluleMin);
        tableStats.appendChild(ligne);
      });
    }

    function ajouterOption(valeur, texte) {
      const option = document.createElement("option");
      option.value = valeur;
      option.textContent = texte;
      choixExotique.appendChild(option);
    }

    // La liste des exotiques dépend de la classe choisie
    function majExotiques() {
      const classe = Number(choixClasse.value);
      choixExotique.innerHTML = "";
      ajouterOption("peu", "Peu importe");
      ajouterOption("aucune", "Aucune pièce exotique");

      const noms = [];
      for (const armure of toutesLesArmures) {
        if (armure.exotique && armure.classe === classe && noms.indexOf(armure.nom) === -1) {
          noms.push(armure.nom);
        }
      }
      noms.sort(function (a, b) { return a.localeCompare(b); });
      for (const nom of noms) {
        ajouterOption(nom, "Obligatoirement : " + nom);
      }
    }

    choixClasse.addEventListener("change", majExotiques);

    // ---------- La recherche ----------

    // Retire les pièces strictement moins bonnes qu'une autre partout
    function retirerDominees(liste) {
      return liste.filter(function (a) {
        const dominee = liste.some(function (b) {
          if (b === a) { return false; }
          if (a.piece.exotique !== b.piece.exotique) { return false; }
          if (a.piece.exotique && a.piece.nom !== b.piece.nom) { return false; }

          let meilleureQuelquePart = false;
          for (let k = 0; k < a.v.length; k++) {
            if (b.v[k] < a.v[k]) { return false; }
            if (b.v[k] > a.v[k]) { meilleureQuelquePart = true; }
          }
          return meilleureQuelquePart;
        });
        return !dominee;
      });
    }

    function chercher() {
      message.textContent = "";
      zoneResultats.innerHTML = "";

      const classe = Number(choixClasse.value);
      const exotique = choixExotique.value; // "peu", "aucune", ou un nom
      const nbStats = STATS_ARMURE.length;

      // Ce que l'utilisateur a demandé
      const poids = [];
      const minimums = [];
      for (let k = 0; k < nbStats; k++) {
        poids.push(Number(document.getElementById("poids" + k).value) || 0);
        minimums.push(Number(document.getElementById("min" + k).value) || 0);
      }
      const toutZero = poids.every(function (p) { return p === 0; });
      if (toutZero) {
        message.textContent = "Mets une importance supérieure à 0 sur au moins une stat.";
        return;
      }

      // 1. Les pièces candidates pour chaque emplacement
      const candidats = [];
      for (const emplacement of ORDRE) {
        let liste = toutesLesArmures.filter(function (a) {
          if (a.classe !== classe || a.emplacement !== emplacement) { return false; }
          if (exotique === "aucune") { return !a.exotique; }
          if (exotique !== "peu") { return !a.exotique || a.nom === exotique; }
          return true;
        });

        liste = liste.map(function (a) {
          const v = STATS_ARMURE.map(function (hash) {
            return (a.stats && a.stats[hash]) || 0;
          });
          let score = 0;
          for (let k = 0; k < nbStats; k++) {
            score += v[k] * poids[k];
          }
          return { piece: a, v: v, score: score };
        });

        liste = retirerDominees(liste);
        liste.sort(function (a, b) { return b.score - a.score; });

        if (liste.length === 0) {
          message.textContent = "Aucune pièce « " + emplacement + " » disponible avec ces choix.";
          return;
        }
        candidats.push(liste);
      }

      // 2. Les meilleurs résultats possibles pour les emplacements restants
      const N = ORDRE.length;
      const resteScore = new Array(N + 1).fill(0);
      const resteStats = [];
      for (let i = 0; i <= N; i++) {
        resteStats.push(new Array(nbStats).fill(0));
      }
      for (let i = N - 1; i >= 0; i--) {
        let meilleurScore = 0;
        const meilleursStats = new Array(nbStats).fill(0);
        for (const c of candidats[i]) {
          if (c.score > meilleurScore) { meilleurScore = c.score; }
          for (let k = 0; k < nbStats; k++) {
            if (c.v[k] > meilleursStats[k]) { meilleursStats[k] = c.v[k]; }
          }
        }
        resteScore[i] = resteScore[i + 1] + meilleurScore;
        for (let k = 0; k < nbStats; k++) {
          resteStats[i][k] = resteStats[i + 1][k] + meilleursStats[k];
        }
      }

      // 3. La recherche elle-même
      const meilleurs = [];
      const choix = new Array(N);
      let essais = 0;
      let interrompu = false;

      function scoreReel(totaux) {
        let s = 0;
        for (let k = 0; k < nbStats; k++) {
          s += Math.min(totaux[k], MAX_STAT) * poids[k];
        }
        return s;
      }

      function inserer(score, choixCopie, totauxCopie) {
        meilleurs.push({ score: score, choix: choixCopie, totaux: totauxCopie });
        meilleurs.sort(function (a, b) { return b.score - a.score; });
        if (meilleurs.length > TOP) { meilleurs.pop(); }
      }

      function explorer(i, totaux, scoreBrut, nbExotiques) {
        if (interrompu) { return; }
        essais++;
        if (essais > LIMITE_ESSAIS) { interrompu = true; return; }

        if (i === N) {
          if (exotique !== "peu" && exotique !== "aucune" && nbExotiques !== 1) { return; }
          for (let k = 0; k < nbStats; k++) {
            if (totaux[k] < minimums[k]) { return; }
          }
          inserer(scoreReel(totaux), choix.slice(), totaux.slice());
          return;
        }

        // Peut-on encore atteindre les minimums ?
        for (let k = 0; k < nbStats; k++) {
          if (totaux[k] + resteStats[i][k] < minimums[k]) { return; }
        }
        // Peut-on encore battre le moins bon des meilleurs résultats ?
        if (meilleurs.length === TOP && scoreBrut + resteScore[i] <= meilleurs[TOP - 1].score) {
          return;
        }

        for (const c of candidats[i]) {
          if (c.piece.exotique && nbExotiques === 1) { continue; } // une seule exotique
          choix[i] = c;
          const nouveaux = totaux.map(function (t, k) { return t + c.v[k]; });
          explorer(i + 1, nouveaux, scoreBrut + c.score, nbExotiques + (c.piece.exotique ? 1 : 0));
        }
      }

      explorer(0, new Array(nbStats).fill(0), 0, 0);
      afficherResultats(meilleurs, interrompu);
    }

    // ---------- L'affichage des résultats ----------

    function afficherResultats(meilleurs, interrompu) {
      if (meilleurs.length === 0) {
        message.textContent = interrompu
          ? "Recherche interrompue : trop de combinaisons. Ajoute des minimums pour la réduire."
          : "Aucun set ne respecte tes minimums. Baisse-les ou change la pièce exotique.";
        return;
      }

      if (interrompu) {
        message.textContent = "Recherche interrompue (trop longue) : ces résultats sont peut-être incomplets.";
      }

      for (let i = 0; i < meilleurs.length; i++) {
        const resultat = meilleurs[i];

        const bloc = document.createElement("div");
        bloc.className = "resultat";

        const titre = document.createElement("h3");
        titre.textContent = "Set n°" + (i + 1) + " - score " + resultat.score;
        bloc.appendChild(titre);

        for (const c of resultat.choix) {
          const ligne = document.createElement("div");
          ligne.className = "piece";

          const image = document.createElement("img");
          image.src = "https://www.bungie.net" + c.piece.icone;

          const texte = document.createElement("span");
          texte.textContent =
            c.piece.emplacement + " : " + c.piece.nom +
            (c.piece.exotique ? " (exotique)" : "") + " - " + c.piece.lieu;

          ligne.appendChild(image);
          ligne.appendChild(texte);
          bloc.appendChild(ligne);
        }

        // Les totaux, stat par stat
        const totauxParHash = {};
        let depasse = false;
        STATS_ARMURE.forEach(function (hash, k) {
          totauxParHash[hash] = resultat.totaux[k];
          if (resultat.totaux[k] > MAX_STAT) { depasse = true; }
        });
        const stats = document.createElement("p");
        stats.className = "stats";
        stats.textContent = "Totaux : " + texteStats(totauxParHash) +
          (depasse ? " (au-delà de " + MAX_STAT + ", les points sont perdus)" : "");
        bloc.appendChild(stats);

        // Sauvegarde dans les sets
        const bouton = document.createElement("button");
        bouton.textContent = "Sauvegarder ce set";
        bouton.addEventListener("click", function () {
          const nom = prompt("Nom du set ?");
          if (!nom || nom.trim() === "") { return; }

          const sauvegardes = JSON.parse(localStorage.getItem("setsArmures")) || [];
          sauvegardes.push({
            nom: nom.trim(),
            pieces: resultat.choix.map(function (c) { return c.piece; })
          });
          localStorage.setItem("setsArmures", JSON.stringify(sauvegardes));

          bouton.textContent = "Sauvegardé ! Tu peux l'équiper depuis « Équiper un set ».";
          bouton.disabled = true;
        });
        bloc.appendChild(bouton);

        zoneResultats.appendChild(bloc);
      }
    }

    document.getElementById("chercher").addEventListener("click", chercher);

    // ---------- Chargement de l'inventaire ----------

    async function charger() {
      if (!jeton) {
        statut.textContent = "Tu n'es pas connecté : repasse par la page de connexion.";
        return;
      }

      try {
        statut.textContent = "Recherche de ton compte...";
        let memberships;
        try {
          memberships = await appelerBungie("/User/GetMembershipsForCurrentUser/");
        } catch (erreur) {
          const membershipId = sessionStorage.getItem("membershipId");
          memberships = await appelerBungie("/User/GetMembershipsById/" + membershipId + "/-1/");
        }
        const compte =
          memberships.destinyMemberships.find(function (m) {
            return m.membershipId === memberships.primaryMembershipId;
          }) || memberships.destinyMemberships[0];

        statut.textContent = "Chargement de ton inventaire...";
        const profil = await appelerBungie(
          "/Destiny2/" + compte.membershipType + "/Profile/" + compte.membershipId +
          "/?components=102,201,205,304"
        );

        const statsObjets =
          (profil.itemComponents && profil.itemComponents.stats && profil.itemComponents.stats.data) || {};

        const objets = [];
        function ajouter(liste, lieu) {
          for (const objet of liste) {
            objets.push({ objet: objet, lieu: lieu });
          }
        }
        if (profil.profileInventory && profil.profileInventory.data) {
          ajouter(profil.profileInventory.data.items, "Coffre");
        }
        if (profil.characterInventories && profil.characterInventories.data) {
          for (const id in profil.characterInventories.data) {
            ajouter(profil.characterInventories.data[id].items, "Inventaire d'un personnage");
          }
        }
        if (profil.characterEquipment && profil.characterEquipment.data) {
          for (const id in profil.characterEquipment.data) {
            ajouter(profil.characterEquipment.data[id].items, "Équipée");
          }
        }

        statut.textContent = "Téléchargement des définitions...";
        const definitions = await chargerDefinitions();
        definitionsStats = definitions.stats;

        for (const element of objets) {
          const definition = definitions.objets[element.objet.itemHash];
          if (!definition || definition.itemType !== 2 || !definition.inventory) {
            continue;
          }
          const emplacement = EMPLACEMENTS_ARMURE[definition.inventory.bucketTypeHash];
          if (!emplacement) {
            continue;
          }

          const stats = lireStats(statsObjets, element.objet.itemInstanceId);

          toutesLesArmures.push({
            nom: definition.displayProperties.name,
            icone: definition.displayProperties.icon,
            emplacement: emplacement,
            classe: definition.classType,
            exotique: definition.inventory.tierType === 6,
            lieu: element.lieu,
            idInstance: element.objet.itemInstanceId,
            hash: element.objet.itemHash,
            stats: stats,
            total: totalDesStats(stats)
          });
        }

        construireTableau();
        majExotiques();
        formulaire.style.display = "block";
        statut.textContent = toutesLesArmures.length + " armures chargées. Règle tes critères puis lance la recherche.";
      } catch (erreur) {
        statut.textContent = "Erreur : " + erreur.message;
      }
    }

    charger();
  </script>
</body>
</html>
