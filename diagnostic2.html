<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Diagnostic 2</title>
</head>
<body>
  <h1>Diagnostic 2 (lecture seule)</h1>
  <button id="lancer">Lancer le diagnostic</button>
  <pre id="journal" style="white-space: pre-wrap"></pre>
  <p><a href="profil.html">Retour au profil</a></p>

  <script>
    const CLE_API = "8f0fe7144bbc4fdda21ed3a26889aecb";
    const LANGUE = "fr";
    const jeton = sessionStorage.getItem("jeton");
    const journal = document.getElementById("journal");

    const EMPLACEMENTS_ARMURE = {
      3448274439: "Casque",
      3551918588: "Gants",
      14239492: "Torse",
      20886954: "Jambes",
      1585787867: "Objet de classe"
    };

    function ecrire(texte) {
      journal.textContent += texte + "\n";
    }

    async function appelerBungie(chemin) {
      const reponse = await fetch("https://www.bungie.net/Platform" + chemin, {
        headers: { "X-API-Key": CLE_API, "Authorization": "Bearer " + jeton }
      });
      const donnees = await reponse.json();
      if (donnees.ErrorStatus !== "Success") {
        throw new Error(donnees.ErrorStatus + " - " + donnees.Message);
      }
      return donnees.Response;
    }

    async function telecharger(chemins, nom) {
      const reponse = await fetch("https://www.bungie.net" + chemins[nom]);
      return await reponse.json();
    }

    function nomDe(defs, hash) {
      const def = defs[hash];
      return def && def.displayProperties ? def.displayProperties.name : "(inconnu " + hash + ")";
    }

    async function diagnostic() {
      journal.textContent = "";
      if (!jeton) {
        ecrire("Tu n'es pas connecté : repasse par la page de connexion.");
        return;
      }

      try {
        // 1. Mon compte et mon inventaire
        let memberships;
        try {
          memberships = await appelerBungie("/User/GetMembershipsForCurrentUser/");
        } catch (erreur) {
          const membershipId = sessionStorage.getItem("membershipId");
          memberships = await appelerBungie("/User/GetMembershipsById/" + membershipId + "/-1/");
        }
        const compte =
          memberships.destinyMemberships.find(function (m) {
            return m.membershipId === memberships.primaryMembershipId;
          }) || memberships.destinyMemberships[0];

        const profil = await appelerBungie(
          "/Destiny2/" + compte.membershipType + "/Profile/" + compte.membershipId +
          "/?components=102,201,205,305,310"
        );
        ecrire("Clés de la réponse de Bungie : " + Object.keys(profil).join(", "));
        const idPerso = Object.keys(profil.characterEquipment.data)[0];

        // 2. Les définitions
        const manifest = await appelerBungie("/Destiny2/Manifest/");
        const chemins = manifest.jsonWorldComponentContentPaths[LANGUE];

        ecrire("\nTéléchargement des définitions complètes (environ 15 s)...");
        const defs = await telecharger(chemins, "DestinyInventoryItemDefinition");

        // 3. Toutes mes pièces d'armure
        const objets = [];
        if (profil.profileInventory && profil.profileInventory.data) {
          objets.push(...profil.profileInventory.data.items);
        }
        for (const id in profil.characterInventories.data) {
          objets.push(...profil.characterInventories.data[id].items);
        }
        for (const id in profil.characterEquipment.data) {
          objets.push(...profil.characterEquipment.data[id].items);
        }

        const armures = objets.filter(function (objet) {
          const def = defs[objet.itemHash];
          return def && def.itemType === 2 && def.inventory &&
                 EMPLACEMENTS_ARMURE[def.inventory.bucketTypeHash];
        });

        // 4. Combien ont un set ?
        const parSet = {};
        const exemples = {};
        let avecSet = 0;
        for (const objet of armures) {
          const hash = defs[objet.itemHash].equipableItemSetHash;
          if (hash) {
            avecSet++;
            parSet[hash] = (parSet[hash] || 0) + 1;
            if (!exemples[hash]) { exemples[hash] = objet; }
          }
        }
        ecrire("\nPièces d'armure : " + armures.length + ", dont avec un set : " + avecSet);
        ecrire("Sets trouvés (numéro : nombre de pièces) : " + JSON.stringify(parSet));

        const sets = await telecharger(chemins, "DestinyEquipableItemSetDefinition");
        const hashSets = Object.keys(exemples).slice(0, 2);
        for (const hash of hashSets) {
          ecrire("\nDéfinition du set " + hash + " : " + JSON.stringify(sets[hash]).slice(0, 1200));
        }

        // 5. La version allégée contient-elle l'info de set ?
        const lite = await telecharger(chemins, "DestinyInventoryItemLiteDefinition");
        if (hashSets.length > 0) {
          const exemple = exemples[hashSets[0]];
          ecrire("\nVersion allégée, equipableItemSetHash : " + lite[exemple.itemHash].equipableItemSetHash);
        }

        // 6. Les prises de mods d'une pièce légendaire
        const objetTest = hashSets.length > 0
          ? exemples[hashSets[0]]
          : armures.find(function (o) { return defs[o.itemHash].inventory.tierType !== 6; });

        if (!objetTest) {
          ecrire("\nAucune pièce légendaire trouvée pour tester les prises.");
          return;
        }

        const def = defs[objetTest.itemHash];
        ecrire("\nPièce légendaire testée : " + def.displayProperties.name);

        const plugSets = await telecharger(chemins, "DestinyPlugSetDefinition");
        const entrees = def.sockets.socketEntries;
        const prises = profil.itemComponents.sockets.data[objetTest.itemInstanceId].sockets;
        const reutilisables =
          (profil.itemComponents.reusablePlugs &&
           profil.itemComponents.reusablePlugs.data[objetTest.itemInstanceId] &&
           profil.itemComponents.reusablePlugs.data[objetTest.itemInstanceId].plugs) || {};

        entrees.forEach(function (entree, index) {
          const prise = prises[index];
          const plug = prise && prise.plugHash ? defs[prise.plugHash] : null;
          const categorie = plug && plug.plug ? plug.plug.plugCategoryIdentifier : "?";
          if (String(categorie).indexOf("enhancements") === -1) {
            return; // on ne regarde que les prises de mods
          }

          ecrire("\nPrise " + index + " [" + categorie + "] : mod actuel = " + nomDe(defs, prise.plugHash));
          ecrire("  plugSources : " + entree.plugSources +
                 " | reusablePlugSetHash : " + entree.reusablePlugSetHash +
                 " | randomizedPlugSetHash : " + entree.randomizedPlugSetHash);

          const hashSet = entree.reusablePlugSetHash;
          if (hashSet && plugSets[hashSet]) {
            ecrire("  Dans la définition du set de plugs : " + plugSets[hashSet].reusablePlugItems.length + " mods");
          }

          const dansProfil = profil.profilePlugSets && profil.profilePlugSets.data &&
                             profil.profilePlugSets.data.plugs[hashSet];
          const dansPerso = profil.characterPlugSets && profil.characterPlugSets.data &&
                            profil.characterPlugSets.data[idPerso] &&
                            profil.characterPlugSets.data[idPerso].plugs[hashSet];
          ecrire("  Possédés (profil) : " + (dansProfil ? dansProfil.length : "aucune donnée") +
                 " | possédés (personnage) : " + (dansPerso ? dansPerso.length : "aucune donnée") +
                 " | plugs réutilisables de l'objet : " + (reutilisables[index] ? reutilisables[index].length : "aucune donnée"));

          const echantillon = dansProfil || dansPerso || reutilisables[index] || [];
          echantillon.slice(0, 5).forEach(function (p) {
            const infos = defs[p.plugItemHash] && defs[p.plugItemHash].plug
              ? defs[p.plugItemHash].plug.energyCost : null;
            ecrire("    - " + nomDe(defs, p.plugItemHash) +
                   " | énergie : " + (infos ? infos.energyCost : "-") +
                   " | canInsert : " + p.canInsert + " | enabled : " + p.enabled);
          });
        });

        ecrire("\nTerminé.");
      } catch (erreur) {
        ecrire("Erreur : " + erreur.message);
      }
    }

    document.getElementById("lancer").addEventListener("click", diagnostic);
  </script>
</body>
</html>
