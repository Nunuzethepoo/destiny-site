<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon profil Destiny 2</title>
</head>
<body>
  <h1>Mon profil Destiny 2</h1>
  <p id="statut">Chargement...</p>
  <div id="personnages"></div>
  <p><a href="oauth.html">Retour à la connexion</a></p>
  <p><a href="armures.html">Voir toutes mes armures</a></p>

  <script>
    const CLE_API = "8f0fe7144bbc4fdda21ed3a26889aecb";
    const jeton = sessionStorage.getItem("jeton");
    const statut = document.getElementById("statut");
    const zonePersonnages = document.getElementById("personnages");
    const CLASSES = { 0: "Titan", 1: "Chasseur", 2: "Arcaniste" };

    // Numéros des emplacements d'armure
    const EMPLACEMENTS_ARMURE = {
      3448274439: "Casque",
      3551918588: "Gants",
      14239492: "Torse",
      20886954: "Jambes",
      1585787867: "Objet de classe"
    };

    // Une fonction réutilisable pour parler à Bungie
    async function appelerBungie(chemin) {
      const reponse = await fetch("https://www.bungie.net/Platform" + chemin, {
        headers: {
          "X-API-Key": CLE_API,
          "Authorization": "Bearer " + jeton
        }
      });
      const donnees = await reponse.json();
      if (donnees.ErrorStatus !== "Success") {
        throw new Error(donnees.ErrorStatus + " - " + donnees.Message);
      }
      return donnees.Response;
    }

    // Affiche les armures équipées d'un personnage
    async function afficherArmures(equipement, conteneur) {
      for (const objet of equipement) {
        const emplacement = EMPLACEMENTS_ARMURE[objet.bucketHash];
        if (!emplacement) {
          continue; // ce n'est pas une pièce d'armure
        }

        const definition = await appelerBungie(
          "/Destiny2/Manifest/DestinyInventoryItemDefinition/" + objet.itemHash + "/"
        );

        const ligne = document.createElement("div");
        const image = document.createElement("img");
        image.src = "https://www.bungie.net" + definition.displayProperties.icon;
        image.wth = 48;
        const texte = document.createElement("span");
        texte.textContent = " " + emplacement + " : " + definition.displayProperties.name;

        ligne.appendChild(image);
        ligne.appendChild(texte);
        conteneur.appendChild(ligne);
      }
    }

    async function charger() {
      if (!jeton) {
        statut.textContent = "Tu n'es pas connecté : repasse par la page de connexion.";
        return;
      }

      try {
        // 1. Quels comptes Destiny sont liés à mon compte Bungie ?
        let memberships;
        try {
          memberships = await appelerBungie("/User/GetMembershipsForCurrentUser/");
        } catch (erreur) {
          // Solution de secours : on utilise l'entifiant reçu à la connexion
          const membership = sessionStorage.getItem("membershipId");
          memberships = await appelerBungie("/User/GetMembershipsById/" + membershipId + "/-1/");
        }

        const compte =
          memberships.destinyMemberships.find(function (m) {
            return m.membershipId === memberships.primaryMembershipId;
          }) || memberships.destinyMemberships[0];

        // 2. Mes personnages (200) et leur équipement (205)
        const profil = await appelerBungie(
          "/Destiny2/" + compte.membershipType + "/Profile/" + compte.membershipId + "/?components=200,205"
        );

        statut.textContent = "Connecté : " + compte.bungieGlobalDisplayName;

        const personnages = profil.characters.data;
        const equipements = profil.characterEquipment.data;

        for (const id in personnages) {
          const perso = personnages[id];

          const bloc = document.createElement("div");
          const titre = document.createElement("h2");
          titre.textContent = CLASSES[perso.classType] + " - Puissance " + perso.light;
          bloc.appendChild(titre);
          zonePersonnages.appendChild(bloc);

          await afficherArmures(equipements[id].items, bloc);
        }
      } catch (erreur) {
        statut.textContent = "Erreur : " + erreur.message;
      }
    }

    charger();
  </script>
</body>
</html>
